<div class="app-layout">
  <app-header (toggleMenu)="sidenav.toggle()"></app-header>

  <mat-sidenav-container class="app-sidenav-container" [hasBackdrop]="esMovil()">
    <mat-sidenav #sidenav [mode]="esMovil() ? 'over' : 'side'" [opened]="authService.currentUser() !== null && !esMovil()" class="app-sidenav">
      @if (authService.currentUser()) {
        <app-sidebar (navegar)="cerrarEnMovil(sidenav)"></app-sidebar>
      }
    </mat-sidenav>

    <mat-sidenav-content class="app-sidenav-content">
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
