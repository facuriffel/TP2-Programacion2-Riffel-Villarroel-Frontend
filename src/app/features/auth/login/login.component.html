<div class="auth-container">
    <mat-card class="auth-card">
        <mat-card-header>
            <mat-card-title>Iniciar Sesión</mat-card-title>
            <mat-card-subtitle>Ingresá con tu DNI y contraseña</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>DNI</mat-label>
                    <input matInput formControlName="dni" placeholder="Ej. 40123456" />
                    <mat-icon matSuffix>badge</mat-icon>
                    <mat-error *ngIf="loginForm.get('dni')?.hasError('required')">El DNI es obligatorio</mat-error>
                    <mat-error *ngIf="loginForm.get('dni')?.hasError('pattern')">Solo se permiten números</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Contraseña</mat-label>
                    <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" />
                    <button mat-icon-button matSuffix type="button" (click)="ocultarPassword = !ocultarPassword">
                        <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es
                        requerida</mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" class="w-100"
                    [disabled]="loginForm.invalid || cargando">
                    {{ cargando ? 'Iniciando sesión...' : 'Ingresar' }}
                </button>
            </form>
        </mat-card-content>

        <mat-card-footer class="auth-footer">
            <p>¿No tenés una cuenta? <a routerLink="/registro">Registrate acá</a></p>
        </mat-card-footer>
    </mat-card>
</div>
